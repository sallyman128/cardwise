name: CardWise
options:
  bundleIdPrefix: com.salmaanali
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CardWise:
    type: application
    platform: iOS
    sources:
      - CardWise
    info:
      path: CardWise/Resources/Info.plist
      properties:
        CFBundleDisplayName: CardWise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: CardWise uses your location to find the place you're at and suggest the best card to use there. Your location never leaves your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salmaanali.CardWise
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CardWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CardWiseTests
    dependencies:
      - target: CardWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.salmaanali.CardWiseTests
schemes:
  CardWise:
    build:
      targets:
        CardWise: all
        CardWiseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CardWiseTests
